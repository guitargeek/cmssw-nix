# Packages to build: the transitive closure needed for cmsRun + ROOT-file
# input/output (PoolSource / PoolOutputModule) + the electron data formats used
# by the MyAnalyzer example.
#
# Extended to the scope of the 10_6 configuration: the full local and
# high-level reconstruction chain, then the simulation, and the PAT and
# NanoAOD layer with what it needs of DQM, L1 and HLT, and the raw data
# packers and unpackers with the streamer format. Left out are the
# producers that need inference externals we do not build (TensorFlow,
# PyTorch, Triton) and the rest of the trigger subsystems.
bins:
  - FWCore/Framework
  - FWCore/PluginManager
  - FWCore/ParameterSet
  - IOPool/Common
subsystems:
    # Tracker alignment, for the differentiable-nuisance study:
    # MisalignedTrackerESProducer applies a misalignment scenario scaled by a
    # configurable parameter - the cleanest DIGI/RECO-level nuisance handle
    # in the tracker for fixed-seed finite-difference studies. CommonAlignment carries
    # the alignable hierarchy the producer walks; TrackerAlignment has the
    # producer and the scenario builder.
    Alignment:
        whitelist:
          - CommonAlignment
          - TrackerAlignment
          - LaserAlignment
          - OfflineValidation
    # the top-quark analysis objects, for TopQuarkAnalysis/TopTools (the PAT
    # jet-parton matching that the NanoAOD configuration imports)
    AnalysisDataFormats:
        whitelist:
          - TopObjects

          # split out of Forward. It is needed even though nothing here looks
          # at the forward region, because 20_1 g4SimHits_cfi carries an
          # OnlySDs list naming every sensitive detector to construct and
          # OscarMTProducer throws if a plugin behind one is missing. The
          # 10_6 configuration has no such list - it discovers sensitive
          # detectors from the geometry - which is why that era needs neither
          # this package nor the equivalent.
          - PPS
          - Tracker

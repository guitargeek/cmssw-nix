          - EcalDeadChannelRecoveryAlgos
          - EcalRecAlgos
          - EcalRecProducers
          - HcalRecAlgos
          - HcalRecProducers
    RecoLocalTracker:
        whitelist:
          - ClusterParameterEstimator
          - Records
          - SiPixelClusterizer
          - SiPixelRecHits
          - SiStripClusterizer
          - SiStripRecHitConverter
          - SiStripZeroSuppression
    RecoVertex:
        whitelist:

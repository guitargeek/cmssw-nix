# Packages to build for CMSSW_10_6_X: the transitive closure needed for cmsRun
# + ROOT-file input/output (PoolSource / PoolOutputModule) + the electron data
# formats used by the MyAnalyzer example, extended by the remaining reco
# physics-object data formats (muons, jets, MET, taus, b-tagging, particle
# flow, calorimeter and muon-chamber local reco, L1/HLT trigger objects).
# Same scope as config.yml otherwise, with the 10_6-era package layout: no
# FWStorage (that code lives in Utilities/StorageFactory, IOPool/TFileAdaptor
# and FWCore/Catalog), no alpaka/SoA data formats, xerces-c based site-config
# parsing.
#
# Also included: DataFormats/PatCandidates and its closure (CondFormats
# L1TObjects/Serialization, SimDataFormats GeneratorProducts/JetMatching —
# these bring in the HepMC external — plus Luminosity and PileupSummaryInfo),
# so the pat:: content of miniAOD files can be read. Producing miniAOD or
# nanoAOD would need much more (PhysicsTools, CondCore + CORAL, TensorFlow).
#
# On top of that, a first slice of the reco-path toolchain (towards
# AOD -> miniAOD -> nanoAOD processing): the TrackingTools/MagneticField/
# RecoVertex transient-track machinery, the CommonTools utilities, the
# CORAL-free CondFormats payload classes with their EventSetup records,
# FWLite, and the DataFormats/NanoAOD flat tables. CondCore (conditions DB
# access through the CORAL external, SQLite backend) is included.
#
# Tracker local reco: the SiPixel/SiStrip clusterizers and rec-hit converters
# with the ES machinery they sit on — TrackerGeometry built from the DDD XML
# geometry (DetectorDescription + XMLIdealGeometryESSource + the tracker
# geometry data files), tracker cabling/quality/gain/noise ES producers
# (CalibTracker, incl. the fake/from-parameters conditions sources), and the
# uniform + volume-based magnetic field engines. The Shallow* calibration-
# ntuple producers of CalibTracker/SiStripCommon are pruned at prepare time
# (they would pull in SimTracker truth-matching and the muon geometries).
#
# Calorimeter local reco: the Ecal uncalibrated/calibrated rec-hit
# producers, the Hcal reconstructors and the calo-tower creator, with the
# calo geometry builders (CaloEventSetup, EcalAlgo, HcalTowerAlgo + the
# Ecal/Hcal/HGCal XML data) and the standalone conditions providers
# (EcalTrivialConditionRetriever, HcalHardcodeCalibrations). Several stale
# or optional dependencies are pruned at prepare time, see
# prepare_sources.py.
#
# Full high-level reconstruction chain: tracking + vertexing
# (TrackingTools, RecoTracker, RecoPixelVertexing, RecoVertex), muons
# (RecoMuon), e/gamma (RecoEcal, RecoEgamma), particle flow
# (RecoParticleFlow), jets/MET (RecoJets, RecoMET, JetMETCorrections with
# fastjet), b/tau tagging (RecoBTag with lwtnn, RecoBTau, RecoTauTag) and
# the supporting PhysicsTools/CommonTools/Sim* layers. The DNN producers
# that need TensorFlow/ONNXRuntime and the HLT/L1 tooling (utm external)
# are excluded; see prepare_sources.py for the related prunes.
#
# Simulation: Geant4 detector simulation (SimG4Core, SimG4CMS - see
# examples/MuonGunSim) and, on top of it, digitisation. The DIGI step
# runs inside SimGeneral/MixingModule: the module owns the per-detector
# digitisers and calls them, which is why a job with no pileup to mix
# still goes through it. The digitisers are SimTracker (pixel, strip),
# SimCalorimetry (Ecal, Hcal) and SimMuon (DT, CSC, RPC), and they turn
# the PSimHits and CaloG4Hits the simulation wrote into the same digi
# types the detector reads out - which is what makes the existing local
# reco examples runnable on simulated data instead of toy digis.
bins:
  - FWCore/Framework
  - FWCore/PluginManager
  # edmWriteConfigs: generates the fillDescriptions-based *_cfi.py files
  # (scram's cfipython) at install time
  - FWCore/ParameterSet
  # edmFileUtil (needed by edmDumpEventContent), edmProvDump, edmCopyUtil
  - IOPool/Common
subsystems:
    # Tracker alignment, for the differentiable-nuisance study:
    # MisalignedTrackerESProducer applies a misalignment scenario scaled by a
    # configurable parameter, which is the cleanest DIGI/RECO-level nuisance
    # handle in the tracker - see
    # /home/claude/research/differentiable-nuisance. CommonAlignment carries
    # the alignable hierarchy the producer walks; TrackerAlignment has the
    # producer and the scenario builder.
    Alignment:
        whitelist:
          - CommonAlignment
          - TrackerAlignment

# Packages to build for CMSSW_10_6_X: the transitive closure needed for cmsRun
# + ROOT-file input/output (PoolSource / PoolOutputModule) + the electron data
# formats used by the MyAnalyzer example, extended by the remaining reco
# physics-object data formats (muons, jets, MET, taus, b-tagging, particle
# flow, calorimeter and muon-chamber local reco, L1/HLT trigger objects).
# Same scope as config.yml otherwise, with the 10_6-era package layout: no
# FWStorage (that code lives in Utilities/StorageFactory, IOPool/TFileAdaptor
# and FWCore/Catalog), no alpaka/SoA data formats, xerces-c based site-config
# parsing.
#
# Also included: DataFormats/PatCandidates and its closure (CondFormats
# L1TObjects/Serialization, SimDataFormats GeneratorProducts/JetMatching —
# these bring in the HepMC external — plus Luminosity and PileupSummaryInfo),
# so the pat:: content of miniAOD files can be read. Producing miniAOD or
# nanoAOD would need much more (PhysicsTools, CondCore + CORAL, TensorFlow).
#
# On top of that, a first slice of the reco-path toolchain (towards
# AOD -> miniAOD -> nanoAOD processing): the TrackingTools/MagneticField/
# RecoVertex transient-track machinery, the CommonTools utilities, the
# CORAL-free CondFormats payload classes with their EventSetup records,
# FWLite, and the DataFormats/NanoAOD flat tables. CondCore itself (real
# conditions access) is still out: it needs the CORAL external.
bins:
  - FWCore/Framework
  - FWCore/PluginManager
  # edmFileUtil (needed by edmDumpEventContent), edmProvDump, edmCopyUtil
  - IOPool/Common
subsystems:
    CalibTracker:
        whitelist:
          - Records
    CommonTools:
        # no_plugins: MVAUtils' only plugin is a conditions-DB writer that
        # would pull in CondCore and the CORAL externals
        no_plugins: true
        whitelist:
          - CandUtils
          - MVAUtils
          - Statistics
          - Utils
    CondFormats:
        whitelist:
          - Alignment
          - AlignmentRecord
          - BTauObjects
          - Common
          - DataRecord
          - EcalObjects
          - EgammaObjects
          - External
          - L1TObjects
          - PhysicsToolsObjects
          - Serialization
    DataFormats:
        no_plugins: true
        whitelist:
          - BTauReco
          - BeamSpot
          - CLHEP
          - CSCRecHit
          # CTPPS + forward protons + L1 stage-2 trigger blocks: present in
          # every UL2016 miniAOD event record
          - CTPPSDetId
          - CTPPSDigi
          - CTPPSReco
          - CaloRecHit
          - CaloTowers
          - Candidate
          - Common
          - DTDigi
          - DTRecHit
          - DetId
          - EcalDetId
          # EcalRecHit's collection headers reach the EcalDigi data frames
          - EcalDigi
          - EcalRecHit
          - EgammaCandidates
          - EgammaReco
          - EgammaTrackReco
          - FEDRawData
          - FWLite
          - FTLRecHit
          - ForwardDetId
          - GEMRecHit
          - GeometryCommonDetAlgo
          - GeometrySurface
          - GeometryVector
          - GsfTrackReco
          - HLTReco
          - HcalDetId
          - HcalDigi
          # referenced by HLTReco's TriggerRefsCollections dictionary
          - HcalIsolatedTrack
          - HcalRecHit
          - HepMCCandidate
          - JetReco
          - L1CaloTrigger
          - L1GlobalCaloTrigger
          - L1GlobalMuonTrigger
          - L1GlobalTrigger
          - L1TGlobal
          - L1Trigger
          - Luminosity
          - METReco
          - Math
          # header-only (MuonDigiCollection, referenced by the digi dictionaries)
          - MuonData
          - MuonDetId
          - MuonReco
          - MuonSeed
          - NanoAOD
          - ParticleFlowCandidate
          - ParticleFlowReco
          - PatCandidates
          - Phase2TrackerCluster
          - Phase2TrackerDigi
          - ProtonReco
          - Provenance
          - RecoCandidate
          - Scalers
          # not in the strict BuildFile closure, but the TrackerRecHit2D
          # dictionary references SiPixelCluster (cling autoload warning
          # otherwise)
          - SiPixelCluster
          - SiPixelDetId
          - SiStripCluster
          - SiStripDetId
          # SiStripCluster's header reaches the strip digi headers
          - SiStripDigi
          - StdDictionaries
          - Streamer
          - TauReco
          - TrackCandidate
          - TrackReco
          - TrackerCommon
          - TrackerRecHit2D
          - TrackingRecHit
          - TrajectorySeed
          - TrajectoryState
          - VertexReco
          - WrappedStdDictionaries
    FWCore:
        whitelist:
          - Catalog
          - Common
          - Concurrency
          - FWLite
          - Framework
          - MessageLogger
          - MessageService
          - Modules
          - ParameterSet
          - ParameterSetReader
          - PluginManager
          - PrescaleService
          - PythonParameterSet
          - PythonUtilities
          - ServiceRegistry
          - Services
          - Sources
          - Utilities
          - Version
    Geometry:
        whitelist:
          - CaloGeometry
          - CommonDetUnit
          - EcalMapping
          - Records
    IOPool:
        whitelist:
          - Common
          - Input
          - Output
          - Provenance
          - TFileAdaptor
    MagneticField:
        whitelist:
          - Engine
          - Records
    PhysicsTools:
        whitelist:
          # python-only package: cmstools & friends, imported by
          # edmDumpEventContent
          - PythonAnalysis
    RecoLocalTracker:
        whitelist:
          - Records
    RecoVertex:
        whitelist:
          - VertexPrimitives
          - VertexTools
    SimDataFormats:
        whitelist:
          - GeneratorProducts
          - JetMatching
          - PileupSummaryInfo
          - RandomEngine
    TrackingTools:
        whitelist:
          - AnalyticalJacobians
          - GeomPropagators
          - GsfTools
          - PatternTools
          - Records
          - TrajectoryParametrization
          - TrajectoryState
          - TransientTrack
    Utilities:
        whitelist:
          - StorageFactory
          - Xerces
